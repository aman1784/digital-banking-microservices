# src/test/resources/application.yml
spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Creates schema before tests, drops it after
    show-sql: true

# Disable eureka and config server for tests to prevent connection errors
eureka:
  client:
    enabled: false
spring.cloud.config.enabled: false