spring:
  datasource:
    url: jdbc:h2:mem:transaction_test_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Disable eureka and config server for tests to prevent connection errors
eureka:
  client:
    enabled: false
spring.cloud.config.enabled: false